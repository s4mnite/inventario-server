<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF9F1C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inventario</title>
    <style>
      html, body { background: #121110 !important; }
      #app-loading-screen {
        position: fixed; inset: 0; z-index: 99999;
        background: #121110;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
      }
      #app-loading-screen .egg { font-size: 64px; animation: egg-spin 1.2s ease-in-out infinite; }
      #app-loading-screen .label { color: #FAF8F3; font-weight: 800; font-size: 15px; font-family: 'Archivo Black', system-ui, sans-serif; letter-spacing: 0.5px; }
      @keyframes egg-spin {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.12); }
        100% { transform: rotate(360deg) scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading-screen"><div class="egg">🥚</div><div class="label">Cargando…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
